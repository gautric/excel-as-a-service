name: eaas-ci-matrix

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test (JDK ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        version: [21]
        experimental: [false]
        include:
          - version: 25
            experimental: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.version }}
          distribution: 'corretto'
          cache: maven

      - name: Build with Maven
        run: ./mvnw --batch-mode --no-transfer-progress --update-snapshots verify

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test results (JDK ${{ matrix.version }})
          files: '**/target/surefire-reports/TEST-*.xml'

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.version }}
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Upload Quarkus apps
        if: ${{ matrix.version == 21 }}
        uses: actions/upload-artifact@v7
        with:
          name: quarkus-apps
          path: '*/target/quarkus-app/'
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
