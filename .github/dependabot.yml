version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      quarkus:
        patterns: ['io.quarkus*']
      maven-plugins:
        patterns: ['org.apache.maven.plugins:*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /excel-rest/src/main/docker
    schedule:
      interval: weekly
